[package]
name = "tent_of_trials"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tent_of_trials"
path = "src/main.rs"

[lib]
name = "tent_of_trials"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
axum-test-helper = "0.4"
